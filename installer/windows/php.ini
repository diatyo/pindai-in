[PHP]
extension_dir="ext"
extension=curl
extension=exif
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=mysqli
extension=openssl
extension=zip
date.timezone=Asia/Jakarta
display_errors=Off
log_errors=On
memory_limit=512M
upload_max_filesize=12M
post_max_size=32M
max_execution_time=120
session.cookie_httponly=1
session.cookie_samesite=Lax
expose_php=Off
