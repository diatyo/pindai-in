<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="220" viewBox="0 0 1120 220" role="img" aria-labelledby="title desc">
  <title id="title">Alur penggunaan Pindai.in</title>
  <desc id="desc">Pindai QR barang, catat peminjaman, periksa pengembalian, lalu pantau status dan riwayat.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#c39743" stroke-width="1.5"/></marker>
    <g id="card"><rect width="246" height="184" rx="18" fill="#fff7e8" stroke="#c39743" stroke-width="1.5"/><circle cx="123" cy="60" r="30" fill="#f0dfbc"/></g>
  </defs>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#392d23" text-anchor="middle">
    <g transform="translate(24 18)">
      <use href="#card"/><text x="23" y="30" font-size="14" font-weight="700" fill="#8a672c">01</text>
      <g transform="translate(105 42)" fill="none" stroke="#5d422e" stroke-width="2.4"><rect x="0" y="0" width="13" height="13" rx="1"/><rect x="23" y="0" width="13" height="13" rx="1"/><rect x="0" y="23" width="13" height="13" rx="1"/><path d="M23 23h6v6h7v7H23v-7M6 4v5M29 4v5M6 27v5"/></g>
      <text x="123" y="122" font-size="22" font-weight="700">Pindai QR</text><text x="123" y="151" font-size="20">barang</text>
    </g>
    <g transform="translate(298 18)">
