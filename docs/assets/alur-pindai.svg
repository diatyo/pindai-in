      <g transform="translate(106 40)" fill="none" stroke="#5d422e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="28" height="35" rx="4"/><path d="M10 4V1h14v3M10 15h14M10 23h14M10 31h9"/></g>
      <text x="123" y="122" font-size="22" font-weight="700">Catat</text><text x="123" y="151" font-size="20">peminjaman</text>
    </g>
    <g transform="translate(572 18)">
      <use href="#card"/><text x="23" y="30" font-size="14" font-weight="700" fill="#8a672c">03</text>
      <g transform="translate(105 42)" fill="none" stroke="#5d422e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="34" height="34" rx="7"/><path d="m9 18 6 6 12-13"/></g>
